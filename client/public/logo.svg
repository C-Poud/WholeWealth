<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="nw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00" />
      <stop offset="100%" stop-color="#80B300" />
    </linearGradient>
    <linearGradient id="nw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="nw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / Hexagon -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#nw-bg)" stroke="#27272A" stroke-width="1.5" />
  
  <!-- Subtle Grid Accent -->
  <path d="M12 24h24M24 12v24" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 2" />
  
  <!-- Modern Geometric 'N' + Delta Growth Ascent -->
  <!-- Left Pillar -->
  <path d="M14 34V14L20 14V34H14Z" fill="#27272A" />
  <path d="M14 34V14" stroke="url(#nw-grad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Diagonal Beam -->
  <path d="M14 14L34 34" stroke="url(#nw-grad)" stroke-width="3.5" stroke-linecap="round" filter="url(#nw-glow)" />
  
  <!-- Right Pillar & Arrow Ascender -->
  <path d="M34 34V14" stroke="url(#nw-grad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M28 14L34 14L34 20" stroke="#D4FF00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing Target Node -->
  <circle cx="34" cy="14" r="3" fill="#D4FF00" />
</svg>
